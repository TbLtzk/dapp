.before_script_template:
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf https://gitlab.com/
    - go env -w GOPRIVATE=gitlab.com/${CI_PROJECT_NAMESPACE}

stages:
  - "test"
  - "build"
  - "deploy"


.host-login: &host-login
  before_script:
    - mkdir -p ~/.ssh
    - ssh-keyscan $DEPLOY_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - cp $DEPLOY_KEY ~/.ssh/id_rsa
    - cp $DEPLOY_PUBKEY ~/.ssh/id_rsa.pub
    - chmod 600 ~/.ssh/id_rsa ~/.ssh/id_rsa.pub

.host-deploy-dev: &host-deploy-dev
  script:
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd ~/$DEPLOY_FOLDER && if [ ! -f .env.local ]; then echo \"IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA\" > .env.local; else sed -i \"s|^IMAGE=.*|IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA|\" .env.local; fi"
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd ~/$DEPLOY_FOLDER && IMAGE="${CI_REGISTRY_IMAGE}:$CI_COMMIT_SHA" docker compose pull && IMAGE="${CI_REGISTRY_IMAGE}:$CI_COMMIT_SHA" docker compose up -d"


.host-deploy: &host-deploy
  script:
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd ~/$DEPLOY_FOLDER && if [ ! -f .env.local ]; then echo \"IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG\" > .env.local; else sed -i \"s|^IMAGE=.*|IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG|\" .env.local; fi"
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd ~/$DEPLOY_FOLDER && IMAGE="${CI_REGISTRY_IMAGE}:$CI_COMMIT_TAG" docker compose pull && IMAGE="${CI_REGISTRY_IMAGE}:$CI_COMMIT_TAG" docker compose up -d"

test:
  image: node:lts
  stage: test
  only:
    - merge_request
    - master
  script:
    - yarn config set '//gitlab.com/api/v4/packages/npm/:_authToken' $CI_JOB_TOKEN
    - yarn --frozen-lockfile
    - yarn lint
    - yarn build

build:
  image:
    name: "gcr.io/kaniko-project/executor:v1.23.2-debug"
    entrypoint: [""]
  stage: build
  when: manual
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
      --cache=true
      --cache-repo="${CI_REGISTRY_IMAGE}/cache"
      --build-arg COMMIT="${CI_COMMIT_SHA}"
      --build-arg VERSION="$CI_COMMIT_SHA"
      --build-arg BUILDNUM="${CI_JOB_ID}"
      --build-arg CI_JOB_TOKEN="${CI_JOB_TOKEN}"
      --build-arg BUILD_TOKEN="${CI_JOB_TOKEN}"
      --build-arg USERNAME="gitlab-ci-token"

build-tag:
  image:
    name: "gcr.io/kaniko-project/executor:v1.23.2-debug"
    entrypoint: [""]
  stage: build
  only:
    - tags
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      --cache=true
      --cache-repo="${CI_REGISTRY_IMAGE}/cache"
      --build-arg COMMIT="${CI_COMMIT_SHA}"
      --build-arg VERSION="$CI_COMMIT_TAG"
      --build-arg BUILDNUM="${CI_JOB_ID}"
      --build-arg CI_JOB_TOKEN="${CI_JOB_TOKEN}"
      --build-arg BUILD_TOKEN="${CI_JOB_TOKEN}"
      --build-arg USERNAME="gitlab-ci-token"

deploy:
  <<: [*host-login]
  <<: [*host-deploy-dev]
  stage: deploy
  when: manual

deploy-testnet:
  <<: [*host-login]
  <<: [*host-deploy]
  stage: deploy
  when: manual
  only:
    - /^v.*$/
  environment: testnet

deploy-mainnet:
  <<: [*host-login]
  <<: [*host-deploy]
  stage: deploy
  when: manual
  only:
    - /^v.*$/
  environment: mainnet
