include:
  - project: "q-dev/infrastructure/common-ci"
    ref: "main"
    file: "semantic-release-basic.yml"

variables:
  IMAGE: qdevelopment/dapp:$CI_COMMIT_TAG
  IMAGE_LATEST: qdevelopment/dapp:latest



.before_script_template:
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf https://gitlab.com/
    - go env -w GOPRIVATE=gitlab.com/${CI_PROJECT_NAMESPACE}

stages:
  - ".pre"
  - "test"
  - "build"
  - "deploy"
  - ".post"


.host-login: &host-login
  before_script:
    - mkdir -p ~/.ssh
    - ssh-keyscan $DEPLOY_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - cp $DEPLOY_KEY ~/.ssh/id_rsa
    - cp $DEPLOY_PUBKEY ~/.ssh/id_rsa.pub
    - chmod 600 ~/.ssh/id_rsa ~/.ssh/id_rsa.pub

.host-deploy: &host-deploy
  script:
    - ssh $DEPLOY_USER@$DEPLOY_HOST "mkdir -p ~/dapp"
    - scp production.yml $DEPLOY_USER@$DEPLOY_HOST:~/dapp/docker-compose.yml
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd ~/dapp && IMAGE=$IMAGE docker-compose pull && IMAGE=$IMAGE docker-compose up -d"

test:
  image: node:lts
  stage: test
  only:
    - master
    - merge_request
  script:
    - yarn config set '//gitlab.com/api/v4/packages/npm/:_authToken' $NPM_TOKEN
    - yarn --frozen-lockfile
    - yarn lint
    - yarn build

build:
  image:
    name: "gcr.io/kaniko-project/executor:v1.3.0-debug"
    entrypoint: [""]
  stage: build
  only:
    - tags
  tags:
    - "gitlab-org-docker"
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --build-arg BUILD_TOKEN="$NPM_TOKEN"
      --build-arg COMMIT="${CI_COMMIT_SHORT_SHA}"
      --build-arg VERSION="${RELEASE_VERSION}"
      --build-arg BUILDNUM="${CI_JOB_ID}"
      --build-arg BUILD_TOKEN="${CI_JOB_TOKEN}"
      --build-arg USERNAME="gitlab-ci-token"

publish:
  image:
    name: "gcr.io/go-containerregistry/crane/debug:v0.11.0"
    entrypoint: [""]
  stage: "release"
  tags:
    - "gitlab-org-docker"
  only:
    - "tags"
  before_script:
    - "crane auth login index.docker.io -u ${REGISTRY_USER} -p ${REGISTRY_PASS}"
    - "crane auth login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD}"
  script:
    - >-
      crane copy "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${RELEASE_IMAGE_NAME}:${RELEASE_VERSION}"
    - >-
      crane copy "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}:${RELEASE_VERSION}"
    - >-
      crane copy "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}:latest"



deploy:
  <<: [*host-login]
  <<: [*host-deploy]
  stage: deploy
  only:
    - /^v.*$/
  except:
    - branches

deploy-testnet:
  <<: [*host-login]
  <<: [*host-deploy]
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG == "testnet"'
  environment:
    name: testnet

deploy-mainnet:
  <<: [*host-login]
  <<: [*host-deploy]
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG == "mainnet"'
  environment:
    name: mainnet
